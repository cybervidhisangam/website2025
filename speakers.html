<!DOCTYPE html>
<html lang="en" class="scroll-smooth no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Speakers — Cyber Vidhi Sangam 2025" />
  <title>Speakers • Cyber Vidhi Sangam 2025</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg-light:#f7fafc; --bg-white:#fff; --text-dark:#1a202c; --text-muted:#718096; --primary:#2f5a75; --border:#e2e8f0; }
    body { font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:var(--bg-light); color:var(--text-dark); }
    .font-serif { font-family:'Playfair Display', serif; }
    .nav-bar { background:var(--bg-white); border-bottom:1px solid var(--border); box-shadow:0 1px 3px rgba(0,0,0,.06) }
    .card { background:var(--bg-white); border:1px solid var(--border); border-radius:12px; transition:transform .15s ease, box-shadow .15s ease; }
    .card:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(0,0,0,.08); }
    .speaker-image { width:120px; height:120px; border-radius:9999px; object-fit:cover; border:4px solid var(--border); margin:0 auto 12px; }
    .btn-primary { display:inline-block; background:var(--primary); color:#fff; padding:.6rem 1rem; border-radius:.5rem; }
    .btn-primary:hover { filter:brightness(1.05); }
  </style>
  <script>document.documentElement.classList.remove('no-js'); document.documentElement.classList.add('js');</script>
</head>
<body>
  <!-- Header -->
  <header class="nav-bar sticky top-0 z-50">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center flex-wrap">
      <a href="index.html" class="font-serif text-2xl font-bold text-gray-900">
        <img src="images/cvs-2.png" alt="Cyber Vidhi Sangam" style="height:80px;width:160px" />
      </a>
      <div class="md:hidden">
        <button id="mobile-menu-button" class="text-gray-800 hover:text-blue-700 focus:outline-none" aria-controls="mobile-menu" aria-expanded="false">
          <span class="sr-only">Open main menu</span>
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
        </button>
      </div>
      <div id="mobile-menu" class="hidden w-full md:flex md:items-center md:w-auto">
        <div class="w-full md:flex md:items-center md:space-x-8 pt-4 md:pt-0">
          <a href="index.html#about" class="block py-2 text-gray-600 hover:text-blue-700 transition-colors">The Why</a>
          <a href="index.html#speakers" class="block py-2 text-gray-600 hover:text-blue-700 transition-colors">The Voices</a>
          <a href="index.html#schedule" class="block py-2 text-gray-600 hover:text-blue-700 transition-colors">The Flow</a>
          <!--<a href="#organizers" class="block py-2 text-gray-600 hover:text-blue-700 transition-colors">Organizers</a>-->
          <a href="index.html#panels" class="block py-2 text-gray-600 hover:text-blue-700 transition-colors">The Panels</a>
          <!-- ToDo: add for registration page as well -->
          <a href="registration.html" class="btn-primary mt-4 md:mt-0 md:-my-2">Join Us</a>
        </div>
      </div>
    </nav>
  </header>

  <!-- Hero -->
  <section class="min-h-[40vh] flex items-center justify-center text-center bg-white border-b border-[var(--border)]">
    <div class="px-6 py-16">
      <h1 class="font-serif text-5xl md:text-6xl font-extrabold mb-4">Speakers</h1>
      <p class="text-lg text-[var(--text-muted)] max-w-2xl mx-auto">Voices from law, policy, industry, and security leading the techno-legal conversation.</p>
    </div>
  </section>

  <!-- Controls -->
  <section class="container mx-auto px-6 py-8">
    <div class="flex flex-col md:flex-row gap-4 md:items-center md:justify-between">
      <input id="search" type="text" placeholder="Search by name, org, role..." class="w-full md:w-1/2 border border-[var(--border)] rounded px-4 py-2 focus:outline-none"/>
      <select id="track" class="w-full md:w-56 border border-[var(--border)] rounded px-4 py-2">
        <option value="all">All tracks</option>
        <option value="privacy">Privacy</option>
        <option value="policy">Policy</option>
        <option value="security">Security</option>
        <option value="academia">Academia</option>
      </select>
    </div>
  </section>

  <!-- Grid -->
  <main class="container mx-auto px-6 pb-20">
    <div id="grid" class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-200 bg-gray-50">
    <div class="container mx-auto px-6 py-12 text-center">
      <div class="mt-2 flex items-center gap-4 justify-center">
        <a href="https://cybervidhisangam.org/" class="text-gray-600 hover:text-blue-700 underline" target="_blank" rel="noopener">Website</a>
        <a href="https://www.linkedin.com/groups/15181013/" class="text-gray-600 hover:text-blue-700 underline" target="_blank" rel="noopener">LinkedIn</a>
        <a href="https://www.facebook.com/share/g/17DuBU7hHg/" class="text-gray-600 hover:text-blue-700 underline" target="_blank" rel="noopener">Facebook</a>
        <a href="https://www.instagram.com/cybervidhisangam/" class="text-gray-600 hover:text-blue-700 underline" target="_blank" rel="noopener">Instagram</a>
      </div>
      <p class="text-gray-500 mt-6">© 2025 Cyber Vidhi Sangam</p>
    </div>
  </footer>

  <script>
  // ---- data ----
  const DATA = [
    { name:"Dr. Nigam Nuggehalli", role:"Registrar", org:"NLSIU", track:"academia", img:"images/nigam.jpg" },
    { name:"Dr. A. Nagarathna", role:"Associate Professor of Law", org:"NLSIU", track:"academia", img:"images/nagarathna.jpeg" },
    { name:"Shloka Narayanan", role:"Advocate", org:"Supreme Court", track:"policy", img:"images/shloka.jpeg" },
    { name:"Sachin Dhawan", role:"Deputy Director", org:"The Dialogue", track:"policy", img:"images/sachin.png" },
    { name:"Prof. Siddarth Chauhan", role:"Faculty", org:"NLSIU", track:"academia", img:"images/chauhan.png" },
    { name:"Sandeep K. Akkimolla", role:"Global CISO & DPO", org:"ANSR", track:"privacy", img:"images/sandeep.jpg" },
    { name:"Anuj Bhansali", role:"VP – Trust & Safety", org:"PhonePe", track:"security", img:"images/anuj.jpg" },
    { name:"Rahul Sasi", role:"Co-Founder & CEO", org:"CloudSEK", track:"security", img:"images/rahul.jpeg" },
    { name:"Dr. Fakkeerappa Kaginelli", role:"IPS, DIG L&O", org:"Police", track:"security", img:"images/fakeerappa.jpeg" }
  ];

  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const track = document.getElementById('track');

  function cardHTML(x){
    const orgText = x.org ? `, ${x.org}` : "";
    return `
      <article class="card p-6 text-center">
        <img src="${x.img}" alt="${x.name}" class="speaker-image" onerror="this.src='images/placeholder.png'"/>
        <h3 class="text-lg font-semibold text-gray-900">${x.name}</h3>
        <p class="text-sm text-gray-600">${x.role}${orgText}</p>
      </article>
    `;
  }

  function render(){
    const q = (search.value || '').trim().toLowerCase();
    const t = track.value;
    grid.innerHTML = DATA
      .filter(x => t === 'all' || x.track === t)
      .filter(x => !q || [x.name, x.role, x.org].filter(Boolean).join(' ').toLowerCase().includes(q))
      .map(cardHTML)
      .join('');
  }

  search.addEventListener('input', render);
  track.addEventListener('change', render);
  render();

  // mobile menu
  const menuButton = document.getElementById('mobile-menu-button');
  const mobileMenu = document.getElementById('mobile-menu');
  menuButton?.addEventListener('click', () => {
    const isExpanded = menuButton.getAttribute('aria-expanded') === 'true';
    menuButton.setAttribute('aria-expanded', String(!isExpanded));
    mobileMenu.classList.toggle('hidden');
    if (!mobileMenu.classList.contains('hidden')) {
      mobileMenu.classList.add('absolute','top-16','left-0','right-0','bg-white','border-b','border-gray-200','p-5','flex','flex-col','items-center','space-y-4','shadow-lg');
    } else {
      mobileMenu.classList.remove('absolute','top-16','left-0','right-0','bg-white','border-b','border-gray-200','p-5','flex','flex-col','items-center','space-y-4','shadow-lg');
    }
  });
  </script>
</body>
</html>
